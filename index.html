<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Molten metal moved by magnets alone. Drag electromagnetic coils and watch the melt swirl.">
<meta property="og:title" content="Stirrer">
<meta property="og:description" content="Drag electromagnetic coils and watch thousands of glowing particles swirl, fold and mix.">
<style>html,body{margin:0;background:#0d0b0a}</style>
<meta property="og:type" content="website">
<meta property="og:url" content="https://stirrer.rsymo.com/">
<meta property="og:image" content="https://stirrer.rsymo.com/og/vortex.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://stirrer.rsymo.com/og/vortex.png">
<title>Stirrer</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed melt pool, title top-left, control strip pinned to the bottom. Single dark look on purpose (furnace room). */
:root {
  --bg: #0d0b0a;
  --fg: #f3e9dc;
  --muted: #9a8a7a;
  --line: #3a2e26;
  --ember: #ff6a13;
  --pos: #5ad1ff;
  --neg: #c58bff;
  --panel: #171210;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--mono); font-size: 13px;
  padding-inline: 16px; padding-block: 0; height: 100vh; height: 100dvh;
  overflow: hidden;
}
.app { position: relative; height: 100%; display: flex; flex-direction: column; gap: 12px; padding-block: 14px; min-width: 0; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.4rem, 8vw, 4rem); line-height: .85; letter-spacing: .01em; text-transform: uppercase; margin: 0; text-wrap: balance; }
h1 span { color: var(--ember); }
.hint { color: var(--muted); max-width: 44ch; margin: 0; line-height: 1.5; }
.stage { position: relative; flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 28px; overflow: hidden; background: #0a0807; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
#ui { cursor: grab; }
#ui.drag { cursor: grabbing; }
.controls { display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.field { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 220px; }
label { text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--muted); white-space: nowrap; }
input[type=range] { flex: 1; min-width: 80px; accent-color: var(--ember); }
output { min-width: 5ch; text-align: right; font-variant-numeric: tabular-nums; }
button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--ember); }
button[aria-pressed="true"] { background: var(--ember); border-color: var(--ember); color: #160a03; font-weight: 500; }
:focus-visible { outline: 2px solid var(--pos); outline-offset: 2px; }
.stats { display: flex; gap: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 500; }
.legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; align-items: center; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
</style>

<div class="app">
  <header>
    <h1>Stir<span>rer</span></h1>
    <p class="hint">Molten metal, moved by magnets alone. Drag a coil to reposition it. Tap a coil to reverse its polarity. Opposite coils make the melt fold over itself. <a href="/furnace/" style="color:var(--pos)">Furnace EMS version</a></p>
  </header>

  <div class="stage" id="stage">
    <canvas id="trail"></canvas>
    <canvas id="ui" aria-label="Melt pool with draggable electromagnetic coils"></canvas>
  </div>

  <div class="controls">
    <button id="power" aria-pressed="true">Current on</button>
    <div class="field">
      <label for="freq">Frequency</label>
      <input id="freq" type="range" min="5" max="100" value="50">
      <output id="freqOut">50 Hz</output>
    </div>
    <button id="add">Add coil</button>
    <button id="reset">Reset</button>
    <div class="stats"><span>Coils <b id="nCoils">3</b></span><span>Flow <b id="flow">0</b>%</span></div>
    <div class="legend"><span><i class="dot" style="background:var(--pos)"></i>Clockwise</span><span><i class="dot" style="background:var(--neg)"></i>Counter</span></div>
  </div>
</div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var trail = document.getElementById('trail'), ui = document.getElementById('ui');
  var tctx = trail.getContext('2d'), uctx = ui.getContext('2d');
  var powerBtn = document.getElementById('power'), freq = document.getElementById('freq');
  var freqOut = document.getElementById('freqOut'), flowEl = document.getElementById('flow'), nEl = document.getElementById('nCoils');

  var W = 0, H = 0, dpr = 1, pad = 18, R = 60;
  var on = true, F = 50, t = 0, particles = [], N = 0;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function defaults() {
    return [{ x: .28, y: .5, s: 1 }, { x: .72, y: .5, s: -1 }, { x: .5, y: .22, s: 1 }];
  }
  var coils = defaults();

  // Speed ramp: dull red -> orange -> amber -> white hot
  var ramp = ['#6b1a08', '#9b2a0b', '#d2440e', '#ff6a13', '#ff8c22', '#ffb03a', '#ffd070', '#fff0c8'];
  var B = ramp.length;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
    [trail, ui].forEach(function (c) { c.width = W * dpr; c.height = H * dpr; });
    tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    uctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    tctx.fillStyle = '#0a0807'; tctx.fillRect(0, 0, W, H);
    R = Math.max(38, Math.min(W, H) * 0.11);
    var want = Math.max(2500, Math.min(7000, Math.round(W * H / 170)));
    if (want !== N) {
      N = want;
      while (particles.length < N) particles.push(spawn());
      particles.length = N;
    }
  }

  function spawn() {
    return { x: pad + Math.random() * (W - 2 * pad || 1), y: pad + Math.random() * (H - 2 * pad || 1), vx: 0, vy: 0, px: 0, py: 0, life: 200 + Math.random() * 400 };
  }

  function coilPx(c) { return { x: pad + c.x * (W - 2 * pad), y: pad + c.y * (H - 2 * pad) }; }

  function step() {
    t += 1;
    var k = on ? F / 50 : 0;
    var G = 300 * (R / 60), c2 = R * R;
    var cp = coils.map(coilPx);
    var sum = 0;
    var buckets = [];
    for (var b = 0; b < B; b++) buckets.push([]);

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var tx = 0, ty = 0;
      for (var j = 0; j < cp.length; j++) {
        var dx = p.x - cp[j].x, dy = p.y - cp[j].y;
        var d2 = dx * dx + dy * dy + 1;
        var f = G * coils[j].s * k / (d2 + c2) * (0.5 + 0.5 * Math.exp(-d2 / (c2 * 25)));
        tx += -dy * f; ty += dx * f;
      }
      // slow thermal wobble so the melt is never fully still
      tx += 0.12 * Math.sin(p.y * 0.017 + t * 0.011);
      ty += 0.12 * Math.cos(p.x * 0.017 - t * 0.009);
      p.vx += (tx - p.vx) * 0.08 + (Math.random() - .5) * 0.06;
      p.vy += (ty - p.vy) * 0.08 + (Math.random() - .5) * 0.06;
      p.px = p.x; p.py = p.y;
      p.x += p.vx; p.y += p.vy;
      // crucible walls
      if (p.x < pad) { p.x = pad; p.vx = Math.abs(p.vx) * .4; }
      else if (p.x > W - pad) { p.x = W - pad; p.vx = -Math.abs(p.vx) * .4; }
      if (p.y < pad) { p.y = pad; p.vy = Math.abs(p.vy) * .4; }
      else if (p.y > H - pad) { p.y = H - pad; p.vy = -Math.abs(p.vy) * .4; }
      var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      sum += sp;
      if (--p.life < 0) { var q = spawn(); p.x = q.x; p.y = q.y; p.px = q.x; p.py = q.y; p.life = q.life; continue; }
      var bi = Math.min(B - 1, (sp * 2.2) | 0);
      buckets[bi].push(p);
    }

    tctx.fillStyle = reduce ? 'rgba(10,8,7,0.3)' : 'rgba(10,8,7,0.1)';
    tctx.fillRect(0, 0, W, H);
    tctx.lineWidth = 1.3; tctx.lineCap = 'round';
    for (var bb = 0; bb < B; bb++) {
      var arr = buckets[bb];
      if (!arr.length) continue;
      tctx.strokeStyle = ramp[bb];
      tctx.beginPath();
      for (var m = 0; m < arr.length; m++) { tctx.moveTo(arr[m].px, arr[m].py); tctx.lineTo(arr[m].x + 0.01, arr[m].y); }
      tctx.stroke();
    }

    if (t % 10 === 0) {
      var avg = sum / particles.length;
      flowEl.textContent = Math.min(100, Math.round(avg / 2.4 * 100));
    }
  }

  function drawUI() {
    uctx.clearRect(0, 0, W, H);
    // crucible rim
    uctx.strokeStyle = 'rgba(255,106,19,0.22)'; uctx.lineWidth = 2;
    uctx.beginPath();
    if (uctx.roundRect) uctx.roundRect(pad - 4, pad - 4, W - 2 * pad + 8, H - 2 * pad + 8, 22); else uctx.rect(pad - 4, pad - 4, W - 2 * pad + 8, H - 2 * pad + 8);
    uctx.stroke();
    for (var i = 0; i < coils.length; i++) {
      var c = coils[i], p = coilPx(c);
      var col = c.s > 0 ? '#5ad1ff' : '#c58bff';
      var pulse = on ? 0.5 + 0.5 * Math.sin(t * 0.02 * (F / 50) * 6 + i) : 0;
      // halo
      var g = uctx.createRadialGradient(p.x, p.y, 4, p.x, p.y, 34 + pulse * 10);
      g.addColorStop(0, on ? col + '66' : col + '18'); g.addColorStop(1, col + '00');
      uctx.fillStyle = g; uctx.beginPath(); uctx.arc(p.x, p.y, 34 + pulse * 10, 0, 7); uctx.fill();
      // winding
      uctx.strokeStyle = col; uctx.lineWidth = 2;
      uctx.globalAlpha = on ? 1 : .45;
      uctx.beginPath(); uctx.arc(p.x, p.y, 15, 0, 7); uctx.stroke();
      uctx.beginPath(); uctx.arc(p.x, p.y, 9, 0, 7); uctx.stroke();
      uctx.fillStyle = col; uctx.beginPath(); uctx.arc(p.x, p.y, 3, 0, 7); uctx.fill();
      // direction arrowhead on outer ring
      var a = c.s > 0 ? -0.6 : -2.55;
      var ax = p.x + Math.cos(a) * 15, ay = p.y + Math.sin(a) * 15;
      var d = c.s > 0 ? 1 : -1;
      var tx = -Math.sin(a) * d, ty = Math.cos(a) * d;
      uctx.beginPath();
      uctx.moveTo(ax + tx * 6, ay + ty * 6);
      uctx.lineTo(ax - tx * 1 + Math.cos(a) * 4, ay - ty * 1 + Math.sin(a) * 4);
      uctx.lineTo(ax - tx * 1 - Math.cos(a) * 4, ay - ty * 1 - Math.sin(a) * 4);
      uctx.closePath(); uctx.fill();
      uctx.globalAlpha = 1;
    }
  }

  function loop() { step(); drawUI(); requestAnimationFrame(loop); }

  // Interaction
  var drag = null;
  function pos(e) { var r = ui.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function hit(m) {
    for (var i = coils.length - 1; i >= 0; i--) { var p = coilPx(coils[i]); if ((m.x - p.x) * (m.x - p.x) + (m.y - p.y) * (m.y - p.y) < 30 * 30) return i; }
    return -1;
  }
  ui.addEventListener('pointerdown', function (e) {
    var m = pos(e), i = hit(m);
    if (i < 0) return;
    drag = { i: i, sx: m.x, sy: m.y, moved: false };
    ui.classList.add('drag');
    try { ui.setPointerCapture(e.pointerId); } catch (err) {}
  });
  ui.addEventListener('pointermove', function (e) {
    var m = pos(e);
    if (!drag) { ui.style.cursor = hit(m) >= 0 ? 'grab' : 'default'; return; }
    if (Math.abs(m.x - drag.sx) + Math.abs(m.y - drag.sy) > 4) drag.moved = true;
    var c = coils[drag.i];
    c.x = Math.max(0, Math.min(1, (m.x - pad) / (W - 2 * pad)));
    c.y = Math.max(0, Math.min(1, (m.y - pad) / (H - 2 * pad)));
  });
  function end() {
    if (drag && !drag.moved) coils[drag.i].s *= -1;
    drag = null; ui.classList.remove('drag');
  }
  ui.addEventListener('pointerup', end);
  ui.addEventListener('pointercancel', function () { drag = null; ui.classList.remove('drag'); });

  powerBtn.addEventListener('click', function () {
    on = !on;
    powerBtn.setAttribute('aria-pressed', String(on));
    powerBtn.textContent = on ? 'Current on' : 'Current off';
  });
  freq.addEventListener('input', function () { F = +freq.value; freqOut.textContent = F + ' Hz'; });
  document.getElementById('add').addEventListener('click', function () {
    if (coils.length >= 8) return;
    coils.push({ x: .15 + Math.random() * .7, y: .2 + Math.random() * .6, s: Math.random() < .5 ? 1 : -1 });
    nEl.textContent = coils.length;
  });
  document.getElementById('reset').addEventListener('click', function () {
    coils = defaults(); nEl.textContent = coils.length;
    on = true; powerBtn.setAttribute('aria-pressed', 'true'); powerBtn.textContent = 'Current on';
    freq.value = 50; F = 50; freqOut.textContent = '50 Hz';
    tctx.fillStyle = '#0a0807'; tctx.fillRect(0, 0, W, H);
  });

  window.addEventListener('resize', resize);
  resize();
  // pre-run so the first frame already shows a moving melt
  for (var w = 0; w < 90; w++) step();
  loop();
})();
</script>

<script src="/nav.js?v=3"></script>
</body>
</html>
